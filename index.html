<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dax is Dum</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to right, #4a90e2, #63b8ff);
            margin: 0;
        }

        .container {
            text-align: center;
        }

        .cta-button {
            background-color: #ff4081;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .cta-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .cta-button:hover::before {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="cta-button" onclick="handleButtonClick(this)">Click Me</button>
    </div>

    <script>
        function handleButtonClick(button) {
            button.innerText = 'U are dum btw';
            button.disabled = true; // Disable the button to prevent multiple clicks

            setTimeout(function() {
                window.open('https://www.google.com/search?q=why+is+dax+dum&rlz=1CAJEHJ_enUS1144US1144&oq=why+is+dax+dum&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIICAEQABgWGB4yDQgCEAAYhgMYgAQYigUyDQgDEAAYhgMYgAQYigUyDQgEEAAYhgMYgAQYigUyBwgFEAAY7wXSAQg3NTUxajBqN6gCALACAA&sourceid=chrome&ie=UTF-8&safe=active&ssui=on', '_blank');
                window.open('https://comm-presentation-abhinavs-projects-2ed019bf.vercel.app/', '_blank');
            }, 10000); // 10000 milliseconds = 10 seconds
        }
    </script>
</body>
</html>
